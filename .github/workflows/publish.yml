# 发到 npm。走 OIDC Trusted Publishing —— 仓库里不存任何 token。
#
# npm 那边要对上的三个值（npmjs.com → 包 → Settings → Trusted publisher）：
#   Organization or user:  qijieinnet
#   Repository:            feishu-claude-bridge
#   Workflow filename:     publish.yml     ← 必须和本文件名一字不差
#   Environment:           留空（本 workflow 没有用 environment）
#
# 发布方式：打一个 v 开头的 tag 推上来，例如
#   git tag v0.2.0 && git push origin v0.2.0
name: publish

on:
  push:
    tags: ["v*"]
  # 也允许在 Actions 页面手动触发（用于补发）
  workflow_dispatch:

permissions:
  contents: read
  # OIDC 换取发布凭据全靠这行，少了必然 403
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 要 npm >= 11.5.1，runner 自带的通常比这老
      - name: 升级 npm
        run: npm install -g npm@latest

      - name: 装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # tag 和 package.json 对不上就早点炸，别发出一个版本号错的包
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 里的 $pkg 不一致，先对齐再发"
            exit 1
          fi
          echo "版本一致：$pkg"

      - name: 发布
        run: npm publish
